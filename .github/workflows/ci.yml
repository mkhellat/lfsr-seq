name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # -l (login shell) so conda's activation hooks run and `python`/
        # `pip`/`pytest` resolve inside the conda env, not the runner's
        # bare system Python.
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Python versions conda-forge's sagelib package actually ships
        # builds for (verified directly, 2026-11-12, by listing its
        # available files) -- not a version this project's pyproject.toml
        # merely declares support for. 3.13 has no sagelib build yet;
        # re-check before adding it rather than assuming it's covered.
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    # SageMath is not on PyPI and `apt-get install sagemath` is not a
    # reliable option on current Ubuntu runner images (confirmed broken/
    # removed on 24.04+, see CLAUDE.md's SageMath Dependency section).
    # conda-forge is the SageMath project's own documented, maintained
    # install route.
    #
    # CORRECTION (2026-11-12): a first attempt used `sagelib` (the
    # minimal package supporting `import sage.all`, verified against
    # this project's own sage_imports.py) instead of the full `sage`
    # metapackage, on the theory that nothing here needs Jupyter/
    # plotting/GAP/Macaulay2 interfaces. That theory was wrong in
    # practice, not just in principle: `sagelib` alone does not bundle
    # Maxima (the symbolic computation engine some Sage operations
    # delegate to internally, e.g. certain polynomial factorization
    # paths), and real test runs against `sagelib` failed with
    # `RuntimeError: ECL says: Module error: Don't know how to REQUIRE
    # MAXIMA.` on dozens of tests across both Python versions -- caught
    # by actually running the test suite against it in a real CI run,
    # not assumed from reading import statements alone. The full `sage`
    # metapackage is confirmed to include Maxima and the other runtime
    # dependencies `sagelib`'s own pip metadata declares but doesn't
    # actually install (conway-polynomials, fpylll, mpmath, sympy, etc.)
    # Measured directly (2026-11-12, via a throwaway probe workflow):
    # sagelib installs in ~23s (2.4GB) vs. sage's ~68s (5.4GB) -- a real
    # but, it turns out, not worthwhile trade-off, since sagelib doesn't
    # actually work for this project's real test suite.
    - name: Install Miniforge + sage (conda-forge)
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge
        channel-priority: strict
        python-version: ${{ matrix.python-version }}
        activate-environment: lfsr-ci

    - name: Install sage
      run: conda install -y -n lfsr-ci sage python=${{ matrix.python-version }}

    # Installed into the SAME conda env as sagelib (not a separate venv,
    # unlike local dev's .venv + _sage_discovery.py subprocess-fallback
    # pattern) so `import sage` succeeds immediately via
    # ensure_sage_importable()'s own first, fast attempt (a plain `import
    # sage`) -- no PATH/subprocess discovery dance needed here. That
    # fallback path is independently covered by tests/test_sage_discovery.py
    # (which mocks it directly), so this simpler, faster single-env setup
    # doesn't leave it untested; it's just not exercised *this* way in CI.
    - name: Install lfsr-seq with dev dependencies
      working-directory: app
      run: pip install -e ".[dev,visualization]"

    - name: Run tests (coverage gate enforced via pyproject.toml's --cov-fail-under=90)
      working-directory: app
      run: pytest tests/ -v --cov=lfsr --cov-report=term-missing --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy

    - name: Check code formatting with black
      run: black --check .

    - name: Run ruff linter
      run: ruff check .

    # Intentionally not a hard gate, matching this repo's own Makefile
    # (`make type-check` runs `mypy . || true`) -- mypy has no type stubs
    # for SageMath, so it reports noise unrelated to real type errors in
    # this codebase's own code. See CLAUDE.md's Commands section.
    - name: Run mypy type checking (informational only, not gated)
      run: mypy src/lfsr/ || echo "Type checking completed (not gated -- see Makefile's type-check target for why)"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install build

    - name: Build package
      run: python -m build

    - name: Check build artifacts
      run: |
        ls -lh dist/
        test -f dist/*.whl || exit 1
        test -f dist/*.tar.gz || exit 1
