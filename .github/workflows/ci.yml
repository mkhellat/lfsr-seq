name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # -l (login shell) so conda's activation hooks run and `python`/
        # `pip`/`pytest` resolve inside the conda env, not the runner's
        # bare system Python.
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        # Python versions conda-forge's sagelib package actually ships
        # builds for (verified directly, 2026-11-12, by listing its
        # available files) -- not a version this project's pyproject.toml
        # merely declares support for. 3.13 has no sagelib build yet;
        # re-check before adding it rather than assuming it's covered.
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    # SageMath is not on PyPI and `apt-get install sagemath` is not a
    # reliable option on current Ubuntu runner images (confirmed broken/
    # removed on 24.04+, see CLAUDE.md's SageMath Dependency section).
    # conda-forge is the SageMath project's own documented, maintained
    # install route. `sagelib` (not the full `sage` metapackage) is used
    # deliberately: it is the minimal package that supports `import
    # sage.all`, which is everything src/lfsr/sage_imports.py actually
    # needs (verified by reading that file's imports directly) -- the
    # full `sage` metapackage additionally bundles Jupyter, plotting
    # backends, and interfaces to GAP/Macaulay2/etc. that this project
    # never imports. Measured directly (2026-11-12, via a throwaway probe
    # workflow, since this timing isn't documented anywhere reliable):
    # sagelib installs in ~23s (2.4GB), vs. the full sage package's ~68s
    # (5.4GB) for the exact same conda-forge channel/solver.
    - name: Install Miniforge + sagelib (conda-forge)
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge
        channel-priority: strict
        python-version: ${{ matrix.python-version }}
        activate-environment: lfsr-ci

    - name: Install sagelib
      run: conda install -y -n lfsr-ci sagelib python=${{ matrix.python-version }}

    # Installed into the SAME conda env as sagelib (not a separate venv,
    # unlike local dev's .venv + _sage_discovery.py subprocess-fallback
    # pattern) so `import sage` succeeds immediately via
    # ensure_sage_importable()'s own first, fast attempt (a plain `import
    # sage`) -- no PATH/subprocess discovery dance needed here. That
    # fallback path is independently covered by tests/test_sage_discovery.py
    # (which mocks it directly), so this simpler, faster single-env setup
    # doesn't leave it untested; it's just not exercised *this* way in CI.
    - name: Install lfsr-seq with dev dependencies
      working-directory: app
      run: pip install -e ".[dev,visualization]"

    - name: Run tests (coverage gate enforced via pyproject.toml's --cov-fail-under=90)
      working-directory: app
      run: pytest tests/ -v --cov=lfsr --cov-report=term-missing --cov-report=xml

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff mypy

    - name: Check code formatting with black
      run: black --check .

    - name: Run ruff linter
      run: ruff check .

    # Intentionally not a hard gate, matching this repo's own Makefile
    # (`make type-check` runs `mypy . || true`) -- mypy has no type stubs
    # for SageMath, so it reports noise unrelated to real type errors in
    # this codebase's own code. See CLAUDE.md's Commands section.
    - name: Run mypy type checking (informational only, not gated)
      run: mypy src/lfsr/ || echo "Type checking completed (not gated -- see Makefile's type-check target for why)"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install build

    - name: Build package
      run: python -m build

    - name: Check build artifacts
      run: |
        ls -lh dist/
        test -f dist/*.whl || exit 1
        test -f dist/*.tar.gz || exit 1
