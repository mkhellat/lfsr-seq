[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "lfsr-seq"
dynamic = ["version"]
description = "Linear Feedback Shift Register Analysis Tool"
readme = "README.md"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Mohammadreza Khellat"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
    "Operating System :: MacOS",
]

keywords = ["lfsr", "linear feedback shift register", "cryptography", "finite field", "sagemath"]

# Note: SageMath must be installed separately as it's not available on PyPI
# See requirements.txt for installation instructions

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "black>=23.0.0,<24.0.0",
    "mypy>=1.0.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "sphinx>=5.0.0,<8.0.0",
    "sphinx-rtd-theme>=1.0.0,<3.0.0",
    "sphinx-proof>=0.1.0",
    "ipython>=8.0.0,<9.0.0",
]
# Optional, GF(2)-only third-party LFSR libraries used solely to
# cross-validate our own GF(2) sequence/period output and
# Berlekamp-Massey recovery in tests/test_cross_check_external.py.
# Not required for normal development; those tests skip cleanly if
# this extra isn't installed. See that file's module docstring for
# why these packages can't validate our GF(q>2) support and for known
# quality caveats in lfsr-tools.
cross-check = [
    "pylfsr>=1.0.7,<2.0.0",
    "lfsr-tools>=0.0.1,<1.0.0",
]

# Plotting/dimensionality-reduction libraries used by lfsr.visualization.
# All matplotlib/plotly/networkx imports in that package are soft
# (guarded by HAS_MATPLOTLIB/HAS_PLOTLY/HAS_NETWORKX in
# visualization/base.py) so the package itself doesn't hard-require
# these. This extra exists so `make install-dev` reliably provides
# them for tests/test_visualization_*.py to exercise the real code
# paths instead of only the ImportError fallback branches.
visualization = [
    "matplotlib>=3.5.0,<4.0.0",
    "plotly>=5.0.0,<6.0.0",
    "networkx>=2.8.0,<4.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
]

# Entry point for command-line interface
# After installation, lfsr-seq will be available at: .venv/bin/lfsr-seq
[project.scripts]
lfsr-seq = "lfsr.cli:cli_main"

[tool.setuptools_scm]
root = ".."
write_to = "app/src/lfsr/_version.py"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lfsr = ["py.typed"]
"lfsr.examples" = ["*.json"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Will be enabled after adding type hints
ignore_missing_imports = true  # SageMath imports may not have type stubs

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "F403",  # star imports (needed for sage.all)
    "F405",  # undefined names from star imports (sage.all)
    "E741",  # ambiguous variable names (I for identity matrix is standard)
    "B007",  # unused loop control variable (acceptable in some contexts)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--verbose",
    "--cov=lfsr",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["lfsr"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90

